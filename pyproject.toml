[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Self-hosted personal financial portfolio dashboard for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "moomoo-api (>=10.12,<11)",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
